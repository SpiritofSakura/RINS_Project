# Yellow line forbidden-zone definitions — world frame coordinates (metres).
#
# HOW TO FIND COORDINATES
# -----------------------
# 1. Launch the sim and open RViz.
# 2. In RViz toolbar select the "Publish Point" tool (crosshair icon).
# 3. Run:  ros2 topic echo /clicked_point
# 4. Click each corner of a yellow line in RViz -> note the x/y values printed.
# 5. Fill them in below, then run:  python3 make_yellow_layer.py

yellow_polygons:

yellow_lines:
  line_1:
    width_m: 0.15
    points:
      - [ 3.62,  0.68]
